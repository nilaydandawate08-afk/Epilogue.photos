<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Epilogue Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;

      background:
        linear-gradient(
          rgba(5, 7, 20, 0.45),
          rgba(5, 7, 20, 0.45)
        ),
        url("epilogue-background.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      color: white;
      font-family: "Playfair Display", Georgia, serif;
      text-align: center;
    }

    h1 {
      font-size: 2.7rem;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 35px;
      padding: 12px 25px;

      color: white;
      text-decoration: none;

      background: rgba(90, 70, 150, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 50px;

      transition: 0.25s;
    }

    .back-button:hover {
      transform: scale(1.04);
      background: rgba(120, 90, 190, 0.5);
    }

    .gallery {
      max-width: 1200px;
      margin: auto;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;

      border-radius: 12px;

      box-shadow:
        0 0 15px rgba(150, 120, 255, 0.25);

      transition: transform 0.25s ease;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    #status {
      margin-top: 30px;
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <h1>📸 Epilogue Gallery</h1>

  <p>Memories captured at our farewell.</p>

  <a href="index.html" class="back-button">
    ← Back to Camera
  </a>

  <div class="gallery" id="gallery"></div>

  <p id="status">Loading photos...</p>

  <script>
    const cloudName = "vp7r7uut";

    const gallery = document.getElementById("gallery");
    const status = document.getElementById("status");

    const listURL =
      `https://res.cloudinary.com/${cloudName}/image/list/epilogue.json`;

    fetch(listURL)
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load photos.");
        }

        return response.json();
      })

      .then(data => {

        const photos = data.resources || [];

        if (photos.length === 0) {
          status.textContent = "No photos yet.";
          return;
        }

        photos.forEach(photo => {

          const img = document.createElement("img");

          img.src =
            `https://res.cloudinary.com/${cloudName}/image/upload/${photo.public_id}.${photo.format}`;

          img.alt = "Epilogue farewell memory";

          gallery.appendChild(img);
        });

        status.textContent =
          `${photos.length} memories captured 📸`;

      })

      .catch(error => {
        console.error(error);
        status.textContent =
          "Unable to load the gallery. Please try again.";
      });
  </script>

</body>
</html>
